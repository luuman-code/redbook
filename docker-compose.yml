version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: redbook-backend
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=sqlite:///app/data/redbook.db
      - DATA_DIR=/app/data
    volumes:
      - redbook-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: redbook-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redbook-data:
    driver: local